<style>
:root {
  --canvas: #1b1c1e;
  --panel: #232427;
  --panel-2: #1b1d20;
  --hover: #2e3034;
  --line: rgba(255,255,255,.08);
  --ink: #f2f3f4;
  --ink-soft: #9a9da3;
  --ink-faint: #62656b;
  --accent: #0285ff;
  --accent-soft: rgba(2,133,255,.16);
  --sel: #0285ff;
  --guide: #e3474c;
  --cmp-fill: #232427;
  --cmp-border: #3a3c40;
  --cmp-text: #f2f3f4;
  --cmp-dim: #9a9da3;
  --cmp-light: #edf1f5;
  --cmp-light-text: #1d2430;
  --ui-shadow: 0 8px 24px rgba(0,0,0,.45), 0 2px 6px rgba(0,0,0,.35);
  --font: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --mono: "SF Mono", "JetBrains Mono", Menlo, monospace;
}
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-user-select: none; user-select: none; }
html, body { height: 100%; overflow: hidden; }
body { font-family: var(--font); color: var(--ink); background: var(--canvas); }

/* ---------- viewport & canvas ---------- */
#viewport { position: fixed; inset: 0; overflow: hidden; background: var(--canvas); cursor: default; touch-action: none; }
#viewport.panning { cursor: grab; }
#viewport.panning:active { cursor: grabbing; }
#canvas { position: absolute; top: 0; left: 0; transform-origin: 0 0; }
#svg-layer { position: absolute; top: 0; left: 0; overflow: visible; pointer-events: none; }
#objects { position: absolute; top: 0; left: 0; }

.obj { position: absolute; }
.obj.locked { pointer-events: auto; }

/* ---------- left tool rail ---------- */
#rail {
  position: fixed; left: 12px; top: 50%; transform: translateY(-50%);
  display: flex; flex-direction: column; gap: 2px; padding: 5px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
  box-shadow: var(--ui-shadow); z-index: 40;
}
#rail button {
  width: 38px; height: 38px; border: 0; background: transparent; border-radius: 8px;
  display: flex; align-items: center; justify-content: center; cursor: pointer; color: #c9ccd2;
  position: relative;
}

#export-modal .ex-head { display: flex; align-items: center; justify-content: space-between; font-weight: 600; font-size: 14px; margin-bottom: 10px; }
#export-modal .ex-head button { width: 24px; height: 24px; border: 0; border-radius: 6px; background: transparent; color: var(--ink-soft); cursor: pointer; display: flex; align-items: center; justify-content: center; }
#export-modal .ex-head button:hover { color: #fff; background: var(--hover); }
#export-modal .ex-label { font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-faint); margin-bottom: 6px; }
#export-modal .ex-agents { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }
#export-modal .ex-agents button { flex: 1; min-width: 70px; padding: 7px 4px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel-2); color: var(--ink-soft); font: 500 12px var(--font); cursor: pointer; }
#export-modal .ex-agents button:hover { color: var(--ink); }
#export-modal .ex-agents button.sel { border-color: var(--accent); background: var(--accent-soft); color: var(--ink); }
#export-modal .ex-step { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 10px; }
#export-modal .ex-step-head { display: flex; align-items: center; gap: 8px; font-weight: 600; margin-bottom: 4px; }
#export-modal .ex-num { width: 18px; height: 18px; border-radius: 50%; background: var(--accent); color: #fff; font-size: 11px; display: flex; align-items: center; justify-content: center; flex: none; }
#export-modal .ex-desc { color: var(--ink-soft); font-size: 12px; margin-bottom: 8px; }
#export-modal .ex-copy { width: 100%; padding: 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel-2); color: var(--ink); font: 500 12.5px var(--font); cursor: pointer; }
#export-modal .ex-copy:hover { background: var(--hover); }
#export-modal .ex-copy.done { border-color: var(--accent); color: var(--accent); }
#export-modal .ex-copy.ex-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
#export-modal .ex-copy.ex-primary:hover { background: var(--accent); filter: brightness(1.1); }
#export-modal .ex-copy.ex-primary.done { color: #fff; }
#export-modal .ex-foot { color: var(--ink-faint); font-size: 11px; text-align: center; padding-top: 2px; }
#cmdk-overlay { padding-top: 8vh; }
  #ctxbar { max-width: calc(100vw - 16px); flex-wrap: wrap; }
  #wf-panel { width: min(240px, calc(100vw - 80px)); }
}
@media (pointer: coarse) {
  #wf-panel .wf-search button { width: 32px; height: 32px; }
  #wf-panel .wf-search input { font-size: 16px; }
}

/* component internals */
.wf { width: 100%; height: 100%; position: relative; }
.wf * { pointer-events: none; }
</style>

let undoStack = [], redoStack = [];

}
function redo() {
  if (!redoStack.length) return;
  undoStack.push(prevSnap);

function buildWfPanel() {
  const panel = $('#wf-panel');
  $('#wf-close').onclick = () => setTool('select');
  const list = $('#wf-list');
  const PIN_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 17v5"/><path d="M9 10.8V4h6v6.8l2.5 2.7a1 1 0 0 1-.7 1.7H7.2a1 1 0 0 1-.7-1.7z"/></svg>';
  const tileFor = (r, dup) => {
    const pinned = compPins.includes(r.type);
    const row = el('div', 'wf-row' + (armed === r.type ? ' armed' : '') + (dup ? ' dup' : ''),
      `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">${r.icon}</svg><span>${r.name}</span>${r.key ? `<kbd>${r.key}</kbd>` : ''}`);
    row.title = r.name + (r.key ? ' (' + r.key + ')' : '');
    row.onclick = () => { if (r.type === 'sticky-tool') { setTool('sticky'); } else armComponent(r.type); };
    const pin = el('button', 'pin' + (pinned ? ' on' : ''), PIN_SVG);
    pin.title = pinned ? 'Unpin' : 'Pin';
    pin.onclick = e => {
      e.stopPropagation();
      compPins = pinned ? compPins.filter(t => t !== r.type) : [...compPins, r.type];
      try { localStorage.setItem('wf-comp-pins', JSON.stringify(compPins)); } catch (err) {}
      renderList($('#wf-search-in').value);
    };
    row.appendChild(pin);
    return row;
  };
  let renderList = q => {
    list.innerHTML = '';
    q = (q || '').trim().toLowerCase();
    if (q) {
      const rows = WF_PANEL.filter(r => r.name.toLowerCase().includes(q));
      if (!rows.length) { list.appendChild(el('div', 'wf-empty', 'No results')); setHl(null); return; }
      for (const r of rows) list.appendChild(tileFor(r, false));
      const fr = [...list.querySelectorAll('.wf-row')];
      if (fr.length) setHl(fr[0]); // typed filter: highlight the top match for Enter
      return;
    }
    const byType = t => WF_PANEL.find(r => r.type === t);
    const pins = compPins.map(byType).filter(Boolean);
    const recs = compRecents.filter(t => !compPins.includes(t)).map(byType).filter(Boolean);
    if (pins.length) {
      list.appendChild(el('div', 'wf-sec', 'Pinned'));
      for (const r of pins) list.appendChild(tileFor(r, true));
    }
    if (recs.length) {
      list.appendChild(el('div', 'wf-sec', 'Recently used'));
      for (const r of recs) list.appendChild(tileFor(r, true));
    }
    list.appendChild(el('div', 'wf-sec', 'All components'));
    let aiHeaded = false;
    for (const r of WF_PANEL) {
      if (r.ai && !aiHeaded) { list.appendChild(el('div', 'wf-sec', 'AI components')); aiHeaded = true; }
      list.appendChild(tileFor(r, false));
    }
    // typed or not, the first row is always the highlighted candidate for Enter
    const rows = [...list.querySelectorAll('.wf-row')];
    if (!hlRow || !list.contains(hlRow)) setHl(rows[0] || null);
  };
  $('#wf-search-in').addEventListener('input', e => renderList(e.target.value));
  let hlRow = null;
  const autoHl = () => { const rows = [...list.querySelectorAll('.wf-row')]; setHl(rows[0] || null); };
  const setHl = row => {
    if (hlRow) hlRow.classList.remove('hl');
    hlRow = row;
    if (hlRow) { hlRow.classList.add('hl'); hlRow.scrollIntoView({ block: 'nearest' }); }
  };
  $('#wf-search-in').addEventListener('keydown', e => {
    if (e.key === 'Escape') { e.target.blur(); closeWfPanel(); setTool('select'); }
    if (e.key === 'Enter') { const target = (hlRow && list.contains(hlRow)) ? hlRow : list.querySelector('.wf-row'); if (target) target.click(); }
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      const rows = [...list.querySelectorAll('.wf-row')];
      if (!rows.length) return;
      let idx = rows.indexOf(hlRow);
      idx = idx < 0 ? (e.key === 'ArrowDown' ? 0 : rows.length - 1) : (idx + (e.key === 'ArrowDown' ? 1 : -1) + rows.length) % rows.length;
      setHl(rows[idx]);
    }
    e.stopPropagation();
  });
  const origRender = renderList;
  renderList = q => { origRender(q); autoHl(); };
  renderList('');
}

// ---------- shapes ----------
function shapePath(name, w, h) {
  switch (name) {
    case 'pill': return `<rect x="1" y="1" width="${w - 2}" height="${h - 2}" rx="${(h - 2) / 2}"/>`;
    case 'parallelogram': { const s = Math.min(w * .2, h * .5); return `<polygon points="${s},1 ${w - 1},1 ${w - s},${h - 1} 1,${h - 1}"/>`; }
    case 'trapezoid': { const s = Math.min(w * .18, w / 2 - 2); return `<polygon points="${s},1 ${w - s},1 ${w - 1},${h - 1} 1,${h - 1}"/>`; }
    case 'rhombus': return `<polygon points="${w / 2},1 ${w - 1},${h / 2} ${w / 2},${h - 1} 1,${h / 2}"/>`;
    case 'pentagon': return `<polygon points="${w / 2},1 ${w - 1},${h * .38} ${w * .81},${h - 1} ${w * .19},${h - 1} 1,${h * .38}"/>`;
    case 'hexagon': { const s = w * .25; return `<polygon points="${s},1 ${w - s},1 ${w - 1},${h / 2} ${w - s},${h - 1} ${s},${h - 1} 1,${h / 2}"/>`; }
    case 'roundsame': return `<path d="M1 ${h * .4} Q1 1 ${w * .4} 1 L${w * .6} 1 Q${w - 1} 1 ${w - 1} ${h * .4} L${w - 1} ${h - 1} L1 ${h - 1} Z"/>`;
    case 'octagon': { const s = Math.min(w, h) * .29; return `<polygon points="${s},1 ${w - s},1 ${w - 1},${s} ${w - 1},${h - s} ${w - s},${h - 1} ${s},${h - 1} 1,${h - s} 1,${s}"/>`; }
    case 'circle': return `<ellipse cx="${w / 2}" cy="${h / 2}" rx="${w / 2 - 1}" ry="${h / 2 - 1}"/>`;
    case 'doublecircle': return `<ellipse cx="${w / 2}" cy="${h / 2}" rx="${w / 2 - 1}" ry="${h / 2 - 1}"/><ellipse cx="${w / 2}" cy="${h / 2}" rx="${Math.max(1, w / 2 - 6)}" ry="${Math.max(1, h / 2 - 6)}"/>`;
    case 'triangle': return `<polygon points="${w / 2},1 ${w - 1},${h - 1} 1,${h - 1}"/>`;
    case 'cylinder': return `<path d="M1 ${h * .12} A${w / 2 - 1} ${h * .12} 0 0 1 ${w - 1} ${h * .12} L${w - 1} ${h * .88} A${w / 2 - 1} ${h * .12} 0 0 1 1 ${h * .88} Z M1 ${h * .12} A${w / 2 - 1} ${h * .12} 0 0 0 ${w - 1} ${h * .12}"/>`;
    case 'star': { let p = ''; for (let i = 0; i < 10; i++) { const r = i % 2 ? Math.min(w, h) * .2 : Math.min(w, h) / 2 - 1, a = -Math.PI / 2 + i * Math.PI / 5; p += `${(w / 2 + r * Math.cos(a)).toFixed(1)},${(h / 2 + r * Math.sin(a)).toFixed(1)} `; } return `<polygon points="${p}"/>`; }
    case 'plus': { const t = Math.min(w, h) * .32; return `<path d="M${w / 2 - t / 2} 1 H${w / 2 + t / 2} V${h / 2 - t / 2} H${w - 1} V${h / 2 + t / 2} H${w / 2 - t / 2} V${h - 1} H${w / 2 + t / 2} H${w / 2 - t / 2} V${h / 2 + t / 2} H1 V${h / 2 - t / 2} H${w / 2 - t / 2} Z"/>`; }
    case 'chatbubble': return `<path d="M1 1 H${w - 1} V${h * .75} H${w * .35} L${w * .18} ${h - 1} L${w * .22} ${h * .75} H1 Z"/>`;
    case 'blockarc': { const r = Math.min(w, h) / 2 - 1, ir = r * .5; return `<path d="M${w / 2 - r} ${h / 2} A${r} ${r} 0 0 1 ${w / 2 + r} ${h / 2} L${w / 2 + ir} ${h / 2} A${ir} ${ir} 0 0 0 ${w / 2 - ir} ${h / 2} Z"/>`; }
    case 'heart': { const s = Math.min(w, h) / 24; return `<path d="M12 21 C5 15 1.5 11 1.5 7 A5.5 5.5 0 0 1 12 4.5 A5.5 5.5 0 0 1 22.5 7 C22.5 11 19 15 12 21Z" transform="scale(${(w / 24).toFixed(2)} ${(h / 24).toFixed(2)})"/>`; }
    default: return `<rect x="1" y="1" width="${w - 2}" height="${h - 2}" rx="2"/>`;
  }
}
RENDERERS.shape = o => `
  <svg class="wf" viewBox="0 0 ${o.w} ${o.h}" preserveAspectRatio="none" style="overflow:visible">
    <g fill="${o.style.fill || '#2c3644'}" stroke="${o.style.stroke}" stroke-width="${o.style.sw}" stroke-linejoin="round">
      ${shapePath(o.props.shape || 'rectangle', o.w, o.h)}
    </g>
  </svg>
  ${o.text ? `<div style="position:absolute;inset:0;${center}font-size:${o.props.size || 13}px;color:${WFTEXT};text-align:center;padding:4px;">${o.text}</div>` : ''}`;

RENDERERS.draw = o => {
  const pts = o.props.pts || [];
  const d = pts.map((p, i) => `${i ? 'L' : 'M'}${(p[0] - o.props.minx).toFixed(1)} ${(p[1] - o.props.miny).toFixed(1)}`).join(' ');
  return `<svg class="wf" viewBox="0 0 ${o.w} ${o.h}" preserveAspectRatio="none" style="overflow:visible">
    <path d="${d}" fill="none" stroke="${o.style.stroke}" stroke-width="${o.style.sw + 1}" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>`;
};

RENDERERS.connector = o => {
  const x1 = o.x, y1 = o.y, x2 = o.props.ex, y2 = o.props.ey;
  const minx = Math.min(x1, x2), miny = Math.min(y1, y2);
  const w = Math.max(2, Math.abs(x2 - x1)), h = Math.max(2, Math.abs(y2 - y1));
  const ax = x1 - minx, ay = y1 - miny, bx = x2 - minx, by = y2 - miny;
  let d;
  const style = o.props.lineStyle || 'elbowed';
  if (style === 'straight') d = `M${ax} ${ay} L${bx} ${by}`;
  else if (style === 'curved') { const mx = (ax + bx) / 2; d = `M${ax} ${ay} C${mx} ${ay} ${mx} ${by} ${bx} ${by}`; }
  else {
    const bend = o.props.bend ?? 0.5;
    const mx = ax + (bx - ax) * bend, my = ay + (by - ay) * bend;
    if (Math.abs(x2 - x1) > Math.abs(y2 - y1)) d = `M${ax} ${ay} L${mx} ${ay} L${mx} ${by} L${bx} ${by}`;
    else d = `M${ax} ${ay} L${ax} ${my} L${bx} ${my} L${bx} ${by}`;
  }
  const ang = Math.atan2(by - ay, bx - ax);
  const arrow = (x, y, a) => { const s = 9; return `<path d="M${x} ${y} l${-s * Math.cos(a - .42)} ${-s * Math.sin(a - .42)} M${x} ${y} l${-s * Math.cos(a + .42)} ${-s * Math.sin(a + .42)}" stroke="${o.style.stroke}" stroke-width="${o.style.sw}" fill="none" stroke-linecap="round"/>`; };
  return `<svg class="wf" viewBox="${-8} ${-8} ${w + 16} ${h + 16}" style="overflow:visible">
    <path d="${d}" fill="none" stroke="${o.style.stroke}" stroke-width="${o.style.sw}" ${o.props.dash ? 'stroke-dasharray="6 4"' : ''} stroke-linecap="round" stroke-linejoin="round"/>
    ${o.props.endArrow !== false ? arrow(bx, by, style === 'elbowed' ? (Math.abs(x2 - x1) > Math.abs(y2 - y1) ? (bx > ax ? 0 : Math.PI) : (by > ay ? Math.PI / 2 : -Math.PI / 2)) : ang) : ''}
    ${o.props.startArrow ? arrow(ax, ay, ang + Math.PI) : ''}
  </svg>`;
};

function renderInner(o) { return (RENDERERS[o.type] || RENDERERS.text)(o); }

// ---------- images: file picker, drag-drop, paste ----------
function addImageAt(src, cx, cy, natW, natH) {
  const w = Math.min(320, natW || 320);
  const h = natW ? Math.round(w * (natH / natW)) : 200;
  const o = { id: uid(), type: 'image', x: Math.round(cx - w / 2), y: Math.round(cy - h / 2), w, h, text: '', props: { src }, style: { ...defaultStyle(), fill: '#232427', stroke: 'transparent', sw: 0 } };
  state.objects.push(o); sel = new Set([o.id]);
  pushHistory(); renderAll();
}
function readImageFile(file, cx, cy) {
  const fr = new FileReader();
  fr.onload = () => {
    const img = new Image();
    img.onload = () => addImageAt(fr.result, cx, cy, img.naturalWidth, img.naturalHeight);
    img.src = fr.result;
  };
  fr.readAsDataURL(file);
}
$('#img-file').addEventListener('change', e => {
  const f = e.target.files && e.target.files[0];
  if (f) { const o = selObjects()[0]; if (o) { readImageFileInto(o, f); } }
  e.target.value = '';
});
function readImageFileInto(o, file) {
  const fr = new FileReader();
  fr.onload = () => { o.props.src = fr.result; pushHistory(); renderAll(); };
  fr.readAsDataURL(file);
}
viewport.addEventListener('dragover', e => { e.preventDefault(); });
viewport.addEventListener('drop', e => {

  if (!files.length) return;

// ---------- grouping / ordering / alignment ----------
function groupSelected() {
  const objs = selObjects();
  if (objs.length < 2) return;
  let x1 = 1e9, y1 = 1e9, x2 = -1e9, y2 = -1e9;
  for (const o of objs) { const b = objBounds(o); x1 = Math.min(x1, b.x); y1 = Math.min(y1, b.y); x2 = Math.max(x2, b.x + b.w); y2 = Math.max(y2, b.y + b.h); }
  const g = { id: uid(), type: 'group', x: x1, y: y1, w: x2 - x1, h: y2 - y1, props: { ox: x1, oy: y1 }, style: defaultStyle(), children: objs };
  state.objects = state.objects.filter(o => !sel.has(o.id));
  state.objects.push(g);
  sel = new Set([g.id]);
  pushHistory(); renderAll();
}
function ungroupSelected() {
  const g = selObjects()[0];
  if (!g || g.type !== 'group') return;
  state.objects = state.objects.filter(o => o.id !== g.id);
  for (const c of g.children) state.objects.push(c);
  sel = new Set(g.children.map(c => c.id));
  pushHistory(); renderAll();
}
function reorder(dir) {
  // dir: 'front','back','fwd','bwd'
  const arr = state.objects;
  const move = selObjects();
  if (!move.length) return;
  pushHistorySilent();
  if (dir === 'front' || dir === 'back') {
    state.objects = arr.filter(o => !sel.has(o.id));
    if (dir === 'front') state.objects.push(...move); else state.objects.unshift(...move);
  } else if (dir === 'fwd') {
    for (let i = arr.length - 2; i >= 0; i--) if (sel.has(arr[i].id) && !sel.has(arr[i + 1].id)) [arr[i], arr[i + 1]] = [arr[i + 1], arr[i]];
  } else {
    for (let i = 1; i < arr.length; i++) if (sel.has(arr[i].id) && !sel.has(arr[i - 1].id)) [arr[i], arr[i - 1]] = [arr[i - 1], arr[i]];
  }
  save(); renderAll();
}
function alignSel(mode) {
  const objs = selObjects();
  if (objs.length < 2) return;
  pushHistorySilent();
  const bs = objs.map(o => objBounds(o));
  const minx = Math.min(...bs.map(b => b.x)), maxx = Math.max(...bs.map(b => b.x + b.w));
  const miny = Math.min(...bs.map(b => b.y)), maxy = Math.max(...bs.map(b => b.y + b.h));
  objs.forEach((o, i) => {
    const b = bs[i];
    const dx = mode === 'left' ? minx - b.x : mode === 'right' ? maxx - (b.x + b.w) : mode === 'h' ? (minx + maxx) / 2 - (b.x + b.w / 2) : 0;
    const dy = mode === 'top' ? miny - b.y : mode === 'bottom' ? maxy - (b.y + b.h) : mode === 'v' ? (miny + maxy) / 2 - (b.y + b.h / 2) : 0;
    o.x += dx; o.y += dy;
    if (o.type === 'connector') { o.props.ex += dx; o.props.ey += dy; }
  });
  save(); renderAll();
}
function tidyUp() {
  const objs = selObjects();
  if (objs.length < 3) return;
  pushHistorySilent();
  const bs = objs.map(o => objBounds(o));
  const spreadX = Math.max(...bs.map(b => b.x + b.w)) - Math.min(...bs.map(b => b.x));
  const spreadY = Math.max(...bs.map(b => b.y + b.h)) - Math.min(...bs.map(b => b.y));
  if (spreadX > spreadY) {
    const sorted = objs.map((o, i) => [o, bs[i]]).sort((a, b) => a[1].x - b[1].x);
    const total = sorted.reduce((s, [, b]) => s + b.w, 0);
    const gap = (spreadX - total) / (objs.length - 1);
    let x = Math.min(...bs.map(b => b.x));
    for (const [o, b] of sorted) { const dy = sorted[0][1].y - b.y; o.x += x - b.x; o.y += dy; if (o.type === 'connector') { o.props.ex += x - b.x; o.props.ey += dy; } x += b.w + gap; }
  } else {
    const sorted = objs.map((o, i) => [o, bs[i]]).sort((a, b) => a[1].y - b[1].y);
    const total = sorted.reduce((s, [, b]) => s + b.h, 0);
    const gap = (spreadY - total) / (objs.length - 1);
    let y = Math.min(...bs.map(b => b.y));
    for (const [o, b] of sorted) { const dx = sorted[0][1].x - b.x; o.y += y - b.y; o.x += dx; if (o.type === 'connector') { o.props.ey += y - b.y; o.props.ex += dx; } y += b.h + gap; }
  }
  save(); renderAll();
}
function makeGrid() {
  const objs = selObjects();
  if (objs.length < 2) return;
  pushHistorySilent();
  const cols = Math.ceil(Math.sqrt(objs.length));
  const bs = objs.map(o => objBounds(o));
  const cw = Math.max(...bs.map(b => b.w)) + 24, ch = Math.max(...bs.map(b => b.h)) + 24;
  const x0 = Math.min(...bs.map(b => b.x)), y0 = Math.min(...bs.map(b => b.y));
  objs.forEach((o, i) => {
    const b = bs[i];
    const tx = x0 + (i % cols) * cw, ty = y0 + Math.floor(i / cols) * ch;
    const dx = tx - b.x, dy = ty - b.y;
    o.x += dx; o.y += dy;
    if (o.type === 'connector') { o.props.ex += dx; o.props.ey += dy; }
  });
  save(); renderAll();
}
function toggleLock() {
  const objs = selObjects();
  if (!objs.length) return;
  const newLock = !objs.every(o => o.locked);
  objs.forEach(o => o.locked = newLock);
  pushHistory(); renderAll();
  toast(newLock ? 'Locked' : 'Unlocked');
}
function unlockAll() { state.objects.forEach(o => o.locked = false); pushHistory(); renderAll(); }

// ---------- clipboard ----------
let internalClip = [];
function serializeText(objs) {
  const lines = [];
  for (const o of objs) {
    const b = objBounds(o);
    const head = `${typeName(o)} (${Math.round(b.w)}x${Math.round(b.h)} at ${Math.round(b.x)},${Math.round(b.y)})`;
    const txt = (o.text || '').replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
    lines.push(txt ? `${head}: ${txt}` : head);
    if (o.type === 'image' && o.props.src) lines[lines.length - 1] += ' (contains an image)';
    if (o.type === 'group') for (const c of o.children || []) lines.push('  - ' + (COMP_DEFS[c.type]?.name || c.type) + (c.text ? `: ${c.text.replace(/<[^>]+>/g, ' ').trim()}` : ''));
    if (o.type === 'table' && o.props.data) lines.push('  ' + o.props.data.map(r => r.join(' | ')).join('\n  '));
  }
  return lines.join('\n');
}
async function copySelection(cut = false) {
  const objs = selObjects();
  if (!objs.length) return;
  internalClip = JSON.parse(JSON.stringify(objs));
  const text = serializeText(objs);
  if (cut) { deleteSelected(); toast('Cut'); } else toast('Copied');
  await safeWriteText(text);
}
async function safeWriteText(text) {
  try {
    await Promise.race([
      navigator.clipboard.writeText(text),
      new Promise((_, rej) => setTimeout(() => rej(new Error('clipboard write timeout')), 2000))
    ]);
  } catch (e) {}
}
async function copyTextOnly() {
  const objs = selObjects();
  if (!objs.length) return;
  await safeWriteText(serializeText(objs)); toast('Text copied');
}
async function paste() {
  if (internalClip.length) {
    const clones = JSON.parse(JSON.stringify(internalClip));
    for (const c of clones) {
      c.id = uid(); c.x += 24; c.y += 24;
      if (c.type === 'connector') { c.props.ex += 24; c.props.ey += 24; }
    }
    internalClip = JSON.parse(JSON.stringify(clones));
    state.objects.push(...clones);
    sel = new Set(clones.map(c => c.id));
    pushHistory(); renderAll();
    return;
  }
  try {
    const t = await Promise.race([
      navigator.clipboard.readText(),
      new Promise((_, rej) => setTimeout(() => rej(new Error('clipboard read timeout')), 1500))
    ]);
    if (t) {
      const c = toCanvas(innerWidth / 2, innerHeight / 2);
      addObj({ id: uid(), type: 'text', x: Math.round(c.x - 100), y: Math.round(c.y), w: 320, h: 30, text: esc(t).replace(/\n/g, '<br>'), props: { size: 16 }, style: { ...defaultStyle(), fill: '#25282d', stroke: 'transparent', sw: 0 } });
    }
  } catch (e) {}
}
function duplicateSelection() {
  const objs = selObjects();
  if (!objs.length) return;
  const clones = JSON.parse(JSON.stringify(objs));
  for (const c of clones) {
    c.id = uid(); c.x += 24; c.y += 24;
    if (c.type === 'connector') { c.props.ex += 24; c.props.ey += 24; }
  }
  state.objects.push(...clones);
  sel = new Set(clones.map(c => c.id));
  pushHistory(); renderAll();
}
const EXPORT_CSS = `.wf{width:100%;height:100%;position:relative;}*{margin:0;padding:0;box-sizing:border-box;}div{font-family:Inter,-apple-system,sans-serif;}`;
async function renderObjsToPng(objs) {
  let x1 = 1e9, y1 = 1e9, x2 = -1e9, y2 = -1e9;
  for (const o of objs) { const b = objBounds(o); x1 = Math.min(x1, b.x); y1 = Math.min(y1, b.y); x2 = Math.max(x2, b.x + b.w); y2 = Math.max(y2, b.y + b.h); }
  const pad = 24; x1 -= pad; y1 -= pad; x2 += pad; y2 += pad;
  const w = x2 - x1, h = y2 - y1;
  let inner = '';
  for (const o of objs) {
    const b = o.type === 'connector'
      ? { x: Math.min(o.x, o.props.ex) - 10, y: Math.min(o.y, o.props.ey) - 10, w: Math.abs(o.props.ex - o.x) + 20, h: Math.abs(o.props.ey - o.y) + 20 }
      : objBounds(o);
    inner += `<div style="position:absolute;left:${b.x - x1}px;top:${b.y - y1}px;width:${b.w}px;height:${b.h}px;">${renderInner(o)}</div>`;
  }
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${w * 2}" height="${h * 2}"><foreignObject width="100%" height="100%"><div xmlns="http://www.w3.org/1999/xhtml" style="width:${w}px;height:${h}px;position:relative;background:${CANVAS_TONES.find(t => t[0] === canvasTone)[2]};transform:scale(1);transform-origin:0 0;"><style>${EXPORT_CSS}</style>${inner}</div></foreignObject></svg>`;
  const img = new Image();
  const url = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = url; });
  const cv = document.createElement('canvas');
  cv.width = w * 2; cv.height = h * 2;
  const ctx = cv.getContext('2d');
  ctx.scale(2, 2);
  ctx.drawImage(img, 0, 0, w, h);
  return await new Promise(res => cv.toBlob(res, 'image/png'));
}
async function copyAsPNG() {
  const objs = selObjects();
  if (!objs.length) return;
  try {
    const blob = await renderObjsToPng(objs);
    const write = navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
    const timeout = new Promise((_, rej) => setTimeout(() => rej(new Error('clipboard timeout')), 4000));
    try {
      await Promise.race([write, timeout]);
      toast('Copied as PNG');
    } catch (clipErr) {
      // fallback: download the PNG
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = (state.title || 'wireframe') + '.png';
      a.click();
      toast('Clipboard blocked - downloaded PNG instead');
    }
  } catch (err) {
    console.error(err);
    await copyTextOnly();
    toast('PNG failed - copied as text instead');
  }
}

let cmdkSel = 0, cmdkFiltered = [];
function openCmdk() {
  closePop();

  document.body.classList.add('menu-open');
  $('#cmdk-overlay').style.display = 'flex';
  $('#cmdk-in').value = '';
  renderCmdk('');
  setTimeout(() => $('#cmdk-in').focus(), 10);
}
function closeCmdk(silent) {
  $('#cmdk-overlay').style.display = 'none'; $('#cmdk-in').blur();
  if (!silent) {
    document.body.classList.remove('menu-open');
    if (tool === 'wireframe') { $('#wf-panel').classList.add('open'); document.body.classList.add('menu-open'); }
  }

let recents = [];
try { recents = JSON.parse(localStorage.getItem('wf-recents') || '[]'); } catch (e) {}
function trackRecent(c) {
  recents = [c.name, ...recents.filter(n => n !== c.name)].slice(0, 5);
  try { localStorage.setItem('wf-recents', JSON.stringify(recents)); } catch (e) {}
}
function cmdIcon(c) {
  if (c.cat === 'Wireframe') {
    const wp = WF_PANEL.find(r => r.name === c.name);
    if (wp) return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" width="16" height="16">${wp.icon}</svg>`;
    return icon('grid', 15);
  }
  if (c.icn && ICONS[c.icn]) return icon(c.icn, 15);
  return icon(c.cat === 'Recent commands' ? 'clock' : 'zap', 15);
}
function renderCmdk(q) {
  const list = $('#cmdk-list');
  list.innerHTML = '';
  q = q.trim().toLowerCase();
  const recCmds = !q ? recents.map(n => COMMANDS.find(c => c.name === n)).filter(Boolean).map(c => ({ ...c, cat: 'Recent commands' })) : [];
  const rest = COMMANDS.filter(c => !q || c.name.toLowerCase().includes(q) || c.cat.toLowerCase() === q);
  cmdkFiltered = [...recCmds, ...rest];
  cmdkSel = 0;
  if (!cmdkFiltered.length) { list.appendChild(el('div', 'empty', 'No results')); return; }
  let lastCat = null;
  cmdkFiltered.forEach((c, i) => {
    if (c.cat !== lastCat && !q) { list.appendChild(el('div', 'cat', c.cat)); lastCat = c.cat; }
    const it = el('div', 'item' + (i === cmdkSel ? ' sel' : ''), `${cmdIcon(c)}<span>${esc(c.name)}</span>${c.kbd ? `<kbd>${c.kbd}</kbd>` : ''}`);
    it.onclick = () => { closeCmdk(); trackRecent(c); c.run(); };
    it.onmouseenter = () => { cmdkSel = i; paintCmdkSel(); };
    it.dataset.i = i;
    list.appendChild(it);
  });
}
function paintCmdkSel() {
  document.querySelectorAll('#cmdk-list .item').forEach(it => it.classList.toggle('sel', +it.dataset.i === cmdkSel));
  const selIt = document.querySelector(`#cmdk-list .item[data-i="${cmdkSel}"]`);
  selIt?.scrollIntoView({ block: 'nearest' });
}
$('#cmdk-in').addEventListener('input', e => renderCmdk(e.target.value));
$('#cmdk-in').addEventListener('keydown', e => {
  if (e.key === 'ArrowDown') { e.preventDefault(); cmdkSel = Math.min(cmdkFiltered.length - 1, cmdkSel + 1); paintCmdkSel(); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); cmdkSel = Math.max(0, cmdkSel - 1); paintCmdkSel(); }
  else if (e.key === 'Enter') { const c = cmdkFiltered[cmdkSel]; if (c) { closeCmdk(); trackRecent(c); c.run(); } }
  else if (e.key === 'Escape') closeCmdk();

      p.appendChild(el('div', 'sep'));
      menuRow(p, 'Flip horizontal', '', () => { single.props.flipH = !single.props.flipH; pushHistory(); renderAll(); }, single?.props.flipH, 'flipH');
      menuRow(p, 'Flip vertical', '', () => { single.props.flipV = !single.props.flipV; pushHistory(); renderAll(); }, single?.props.flipV, 'flipV');
    }
    if (selObjects().length >= 2) {
      p.appendChild(el('div', 'sep'));
      menuRow(p, 'Group', '⌘G', groupSelected, undefined, 'group');
      menuRow(p, 'Align left', '', () => alignSel('left'), undefined, 'alignl');
      menuRow(p, 'Align horizontally', '', () => alignSel('h'), undefined, 'alignh');
      menuRow(p, 'Align vertically', '', () => alignSel('v'), undefined, 'alignv');
      menuRow(p, 'Tidy up', '', tidyUp, undefined, 'tidy');
    }
    if (single?.type === 'group') menuRow(p, 'Ungroup', '⌘⇧G', ungroupSelected, undefined, 'ungroup');
    if (single?.type === 'shape') {
      const chRow = el('div', 'row', `<span style="width:14px"></span>${icon('grid', 14)}<span>Change shape</span><kbd>▸</kbd>`);
      chRow.onclick = () => {
        closePop();
        openSearchPop(x, y, SHAPES.map(([id, name]) => ({
          label: name,
          tick: single.props.shape === id || (!single.props.shape && id === 'rectangle'),
          glyph: `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" style="flex:none;color:#9a9da3">${shapePath(id, 24, 24)}</svg>`,
          fn: () => { single.props.shape = id; pushHistory(); renderAll(); },
        })), { placeholder: 'Search shapes…', back: () => openObjMenu(x, y) });
      };
      p.appendChild(chRow);
    }
    if (single && single.type !== 'connector') {
      p.appendChild(el('div', 'sep'));
      menuRow(p, 'Connect', '', () => {
        const b = objBounds(single);
        const o = { id: uid(), type: 'connector', x: Math.round(b.x + b.w), y: Math.round(b.y + b.h / 2), props: { ex: Math.round(b.x + b.w + 80), ey: Math.round(b.y + b.h / 2), lineStyle: 'elbowed', endArrow: true }, style: defaultStyle() };
        state.objects.push(o); sel = new Set([o.id]); pushHistory(); renderAll();
      });
    }
    p.appendChild(el('div', 'sep'));
    menuRow(p, 'Delete', '⌫', deleteSelected, undefined, 'trash');
  });
}
function openCanvasMenu(x, y) {
  openPop(x, y, p => {
    menuRow(p, 'Paste here', '⌘V', paste);
    menuRow(p, 'Select all', '⌘A', () => { sel = new Set(state.objects.map(o => o.id)); renderAll(); }, 'selall');
    p.appendChild(el('div', 'sep'));
    p.appendChild(el('div', 'head', 'Canvas'));
    for (const [id, name, hex] of CANVAS_TONES) {
      const r = el('div', 'row', `<span class="tick">${canvasTone === id ? '✓' : ''}</span><span class="swatch" style="background:${hex};border:1px solid var(--line)"></span><span>${name}</span>`);
      r.onclick = () => { applyCanvasTone(id); closePop(); };
      p.appendChild(r);
    }
    p.appendChild(el('div', 'sep'));
    p.appendChild(el('div', 'head', 'Grid'));
    for (const [id, name] of [['none', 'None'], ['dots', 'Dots'], ['lines', 'Lines']]) {
      menuRow(p, name, '', () => setGridMode(id), gridMode === id, 'grid');
    }
  });
}
viewport.addEventListener('contextmenu', e => {
  e.preventDefault();
  if (e.target.closest('#rail, #ctxbar, .pop')) return;
  const p = toCanvas(e.clientX, e.clientY);
  const hit = hitTest(p.x, p.y);
  if (hit) {
    if (!sel.has(hit.id)) { sel = new Set([hit.id]); renderAll(); }
    openObjMenu(e.clientX, e.clientY);
  } else {
    openCanvasMenu(e.clientX, e.clientY);
  }
});

// ---------- zoom menu ----------
$('#zoom-label').onclick = e => {
  const r = e.target.getBoundingClientRect();
  openPop(r.left - 60, r.top - 8 - 260, p => {
    menuRow(p, 'Zoom in', '⌘+', () => setZoom(view.z * 1.25), undefined, 'zoomin');
    menuRow(p, 'Zoom out', '⌘-', () => setZoom(view.z / 1.25), undefined, 'zoomout');
    p.appendChild(el('div', 'sep'));
    menuRow(p, 'Zoom to 50%', '⌘5', () => setZoom(0.5), undefined, 'zoomout');
    menuRow(p, 'Zoom to 70%', '⌘7', () => setZoom(0.7), undefined, 'zoomout');
    menuRow(p, 'Zoom to 100%', '⌘0', () => setZoom(1), undefined, 'search');
    menuRow(p, 'Zoom to 150%', '', () => setZoom(1.5), undefined, 'zoomin');
    menuRow(p, 'Zoom to 200%', '⌘2', () => setZoom(2), undefined, 'zoomin');
    menuRow(p, 'Zoom to fit', '⇧1', zoomToFit, undefined, 'maximize');
    menuRow(p, 'Zoom to selection', '⇧2', zoomToSelection, undefined, 'selall');
    menuRow(p, 'Snap to grid', '', toggleSnapGrid, snapGrid, 'magnet');
    p.appendChild(el('div', 'sep'));
    menuRow(p, 'Custom zoom', '', () => {
      const v = prompt('Zoom %', Math.round(view.z * 100));
      if (v) setZoom(clamp(parseInt(v) / 100 || 1, 0.05, 4));
    });
  });
};

// ---------- keyboard ----------
let spaceDown = false;
window.addEventListener('blur', () => { spaceDown = false; });
window.addEventListener('keydown', e => {
  if (e.target === textedit || e.target.closest('#cmdk') || e.target.closest('input')) return;
  const mod = e[isMac ? 'metaKey' : 'ctrlKey'];
  const k = e.key.toLowerCase();
  // editor is open but focus hasn't landed yet (deferred focus): never treat letters as hotkeys
  if (editingId && !mod && k !== 'escape') { e.preventDefault(); return; }

  if (k === ' ') { spaceDown = true; viewport.style.cursor = 'grab'; e.preventDefault(); return; }

  if (mod && k === 'k') { e.preventDefault(); openCmdk(); return; }
  if (mod && k === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if (mod && k === 'a') { e.preventDefault();
    if (e.shiftKey) { const inv = state.objects.filter(o => !sel.has(o.id)); sel = new Set(inv.map(o => o.id)); }
    else sel = new Set(state.objects.map(o => o.id));
    renderAll(); return; }
  if (mod && k === 'c' && e.shiftKey) { e.preventDefault(); copyAsPNG(); return; }
  if (mod && k === 'c' && e.altKey) { e.preventDefault(); copyTextOnly(); return; }
  if (mod && k === 'c') { e.preventDefault(); copySelection(); return; }
  if (mod && k === 'x') { e.preventDefault(); copySelection(true); return; }
  if (mod && k === 'v') { e.preventDefault(); paste(); return; }
  if (mod && k === 'd') { e.preventDefault(); duplicateSelection(); return; }
  if (mod && k === 'g') { e.preventDefault(); e.shiftKey ? ungroupSelected() : groupSelected(); return; }
  if (mod && k === ']') { e.preventDefault(); reorder(e.altKey ? 'front' : 'fwd'); return; }
  if (mod && k === '[') { e.preventDefault(); reorder(e.altKey ? 'back' : 'bwd'); return; }
  if (mod && k === 'l' && e.shiftKey) { e.preventDefault(); toggleLock(); return; }
  if (mod && (k === '=' || k === '+')) { e.preventDefault(); setZoom(view.z * 1.25); return; }
  if (mod && k === '-') { e.preventDefault(); setZoom(view.z / 1.25); return; }
  if (mod && k === '0') { e.preventDefault(); setZoom(1); return; }
  if (mod && k === '7') { e.preventDefault(); setZoom(0.7); return; }
  if (mod && k === '1') { e.preventDefault(); zoomToFit(); return; }
  if (!mod && e.shiftKey && k === '!') { e.preventDefault(); zoomToFit(); return; }
  if (!mod && e.shiftKey && k === '@') { e.preventDefault(); zoomToSelection(); return; }
  if (mod && k === '2') { e.preventDefault(); setZoom(2); return; }
  if (mod && k === '3') { e.preventDefault(); setZoom(0.75); return; }
  if (mod && k === '5') { e.preventDefault(); setZoom(0.5); return; }

  if (e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); deleteSelected(); return; }
  if (e.key === 'Escape') {
    if ($('#export-overlay').classList.contains('open')) { closeExport(); return; }
    if (armed) { disarm(); setTool('select'); return; }
    if ($('#wf-panel').classList.contains('open')) { setTool('select'); return; }
    if (popEl) { closePop(); return; }
    if (sel.size) { sel.clear(); renderAll(); }
    else setTool('select');
    return;
  }
  if (e.key.startsWith('Arrow')) {
    const objs = selObjects().filter(o => !o.locked);
    if (!objs.length) return;
    e.preventDefault();
    pushHistorySilent();
    const d = (e.shiftKey ? 10 : 1) / 1;
    const dx = e.key === 'ArrowLeft' ? -d : e.key === 'ArrowRight' ? d : 0;
    const dy = e.key === 'ArrowUp' ? -d : e.key === 'ArrowDown' ? d : 0;
    for (const o of objs) { o.x += dx; o.y += dy; if (o.type === 'connector') { o.props.ex += dx; o.props.ey += dy; } }
    save(); renderAll(); return;
  }
  if (!mod) {
    const compKey = { b: 'button', a: 'annotation', g: 'image', p: 'textinput', o: 'shape:circle', e: 'table', x: 'icon' }[k];
    if (compKey && !e.shiftKey) { armComponent(compKey); return; }
    const t = TOOLS.find(t => t.key === k);
    if (t) { setTool(t.id); return; }
  }
});
window.addEventListener('keyup', e => {
  if (e.key === ' ') { spaceDown = false; setTool(tool); }
});
window.addEventListener('beforeunload', save);
document.addEventListener('mousedown', e => { if (popEl && !e.target.closest('.pop') && !e.target.closest('#ctxbar') && !e.target.closest('#br-cluster')) closePop(); }, true);

// ---------- boot ----------
load();
prevSnap = snapshot();
buildRail();
buildWfPanel();
setTool('select');
applyView();
renderAll();
updateUndoBtns();
applyCanvasTone(canvasTone);
setGridMode(gridMode);
// embedded on the landing page with ?demo=1: always show the starter scene, and never persist it over a visitor's own saved board
if (/[?&]demo=1/.test(location.search)) {
  const __origSetItem = localStorage.setItem.bind(localStorage);
  localStorage.setItem = (k, v) => { if (k === 'wf-board') return; __origSetItem(k, v); };
  state.objects = [];
  window.__demoSeeded = true;
  const put = (t, x, y) => state.objects.push(makeComponent(t, x, y));
  if (/[?&]scene=settings/.test(location.search)) {
    // settings-page scene (matches the skill-section conversation on the landing page)
    const fr2 = makeComponent('frame', 40, 40); fr2.w = 400; fr2.h = 340; fr2.text = 'Settings'; state.objects.push(fr2);
    const put2 = (t, x, y, w, text) => { const c = makeComponent(t, x, y); if (w) c.w = w; if (text) c.text = text; state.objects.push(c); };
    put2('textblock', 80, 90, 300, 'Account settings');
    put2('textinput', 80, 152, 300, 'phil@airfoil.studio');
    put2('dropdown', 80, 204, 300, 'Admin');
    put2('checkbox', 80, 256, 300, 'Email me a copy of my data');
    put2('button', 332, 310, 0, 'Save changes');
    commit(); renderAll();
  } else {
  const fr = makeComponent('frame', 60, 40); fr.w = 900; fr.h = 520; fr.text = 'Support console'; state.objects.push(fr);
  put('statcard', 100, 90);
  const s2 = makeComponent('statcard', 340, 90); s2.props.label = 'PISTACHIO'; s2.props.value = '$9,812'; s2.props.delta = '+1.2%'; state.objects.push(s2);
  const s3 = makeComponent('statcard', 580, 90); s3.props.label = 'ROCKY ROAD'; s3.props.value = '$6,201'; s3.props.delta = '-6.0%'; state.objects.push(s3);
  put('tasklist', 780, 90);
  put('chat', 100, 240);
  put('thinking', 400, 240);
  put('approval', 660, 260);
  put('contextcards', 400, 380);
  put('codeblock', 660, 420);
  put('promptbar', 100, 540);
  commit(); renderAll();
  }
}
if (state.objects.length) zoomToFit();
</script>
<style>
/* ---------- demo autoplay cursor (landing embed only) ---------- */
#demo-cursor { position: fixed; left: 0; top: 0; z-index: 10001; pointer-events: none; display: flex; align-items: flex-start; transition-property: left, top; transition-timing-function: cubic-bezier(.3,.7,.3,1); filter: drop-shadow(0 2px 4px rgba(0,0,0,.4)); }
#demo-cursor span { background: #0285ff; color: #fff; font: 500 10.5px Inter, -apple-system, sans-serif; border-radius: 4px 99px 99px 99px; padding: 3px 8px; margin-top: 14px; margin-left: -3px; white-space: nowrap; }
#demo-ring { position: fixed; z-index: 10000; width: 30px; height: 30px; border: 2px solid #0285ff; border-radius: 50%; pointer-events: none; transform: translate(-50%,-50%) scale(.3); opacity: 0; }
#demo-ring.ping { animation: demoPing .45s ease-out; }
@keyframes demoPing { 0% { opacity: .9; transform: translate(-50%,-50%) scale(.3); } 100% { opacity: 0; transform: translate(-50%,-50%) scale(1.5); } }
.obj.demo-pop { animation: demoPop .22s ease-out; }
@keyframes demoPop { from { opacity: 0; transform: scale(.96); } to { opacity: 1; transform: scale(1); } }
</style>
<script>
// ---------- demo autoplay: a cursor assembles the demo board; any real input interrupts ----------
(function () {
    if (!/[?&]demo=1/.test(location.search) || !/[?&]autoplay=1/.test(location.search)) return;
  if (!window.__demoSeeded) return; // only animate in demo mode (demo mode never persists over a visitor's own board)
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  if (matchMedia('(pointer: coarse)').matches || innerWidth < 700) return; // mobile: keep the finished board, no cursor show
  const blueprint = JSON.parse(JSON.stringify(state.objects));
  // the canvas never starts empty: the frame and first two cards are already on it, the cursor assembles the rest
  const PRESEED = 3;
  const preseed = blueprint.slice(0, PRESEED);
  const toBuild = blueprint.slice(PRESEED);
  let stopped = false;
  const wait = ms => new Promise(r => setTimeout(r, ms));
  const cur = document.createElement('div');
  cur.id = 'demo-cursor';
  cur.innerHTML = '<svg width="17" height="17" viewBox="0 0 24 24" fill="#0285ff" stroke="#fff" stroke-width="1.5"><path d="M4 2l16 9-7 1.5L9 20z"/></svg><span>demo</span>';
  const ring = document.createElement('div');
  ring.id = 'demo-ring';
  const toScreen = (x, y) => ({ x: x * view.z + view.x, y: y * view.z + view.y });
  function moveCur(sx, sy, ms) {
    cur.style.transitionDuration = ms + 'ms';
    cur.style.left = sx + 'px'; cur.style.top = sy + 'px';
    return wait(ms + 80);
  }
  async function clickAt(sx, sy) {
    ring.style.left = sx + 'px'; ring.style.top = sy + 'px';
    ring.classList.remove('ping'); void ring.offsetWidth; ring.classList.add('ping');
    await wait(230);
  }
  function stop() {
    if (stopped) return; stopped = true;
    cur.remove(); ring.remove();
    // hand over a complete board: anything the cursor hadn't placed yet lands instantly
    if (state.objects.length < blueprint.length) state.objects = JSON.parse(JSON.stringify(blueprint));
    commit(); renderAll();
  }
  addEventListener('touchstart', stop, { capture: true });
  addEventListener('pointerdown', stop, { capture: true });
  addEventListener('keydown', stop, { capture: true });
  addEventListener('wheel', stop, { capture: true });
  (async () => {
    // initial paint: the preseed is already on the canvas from the boot seed; strip down to it
    state.objects = JSON.parse(JSON.stringify(preseed)); renderAll();
    await wait(1400); // let the frame settle before the cursor enters
    document.body.appendChild(cur); document.body.appendChild(ring);
    while (!stopped) {
      state.objects = JSON.parse(JSON.stringify(preseed)); renderAll();
      cur.style.transitionDuration = '0ms';
      cur.style.left = (innerWidth - 56) + 'px'; cur.style.top = (innerHeight - 36) + 'px';
      await wait(500);
      for (const o of toBuild) {
        if (stopped) return;
        const b = objBounds(o);
        const c = toScreen(b.x + b.w / 2, b.y + b.h / 2);
        await moveCur(c.x, c.y, 400 + Math.random() * 220);
        if (stopped) return;
        await clickAt(c.x, c.y);
        const placed = JSON.parse(JSON.stringify(o));
        state.objects.push(placed);
        renderAll();
        const el = document.querySelector('.obj[data-id="' + placed.id + '"]');
        if (el) el.classList.add('demo-pop');
        await wait(260);
      }
      commit(); // the finished board becomes the saved board, same as the plain demo seed
      await wait(8000); // hold the finished board
      if (stopped) return;
      const cv = document.getElementById('canvas');
      cv.style.transition = 'opacity .4s'; cv.style.opacity = '0';
      await wait(480);
      state.objects = JSON.parse(JSON.stringify(preseed)); renderAll();
      cv.style.opacity = '1';
      await wait(520);
    }
  })();
})();
</script>
